server:
  port: 8080
  # 开启Gzip压缩
  compression:
    enabled: true
    mime-types: application/javascript,text/css,text/html,application/json,image/jpeg,image/png,image/gif
    min-response-size: 1024

spring:
  # 邮件配置（从 application.properties 迁移过来）
  mail:
    host: smtp.qq.com
    port: 465
    username: 3918743392@qq.com
    password: hwkdhvkdgqabcdeh
    default-encoding: UTF-8
    protocol: smtps
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: true
          debug: true

  datasource:
    url: jdbc:mysql://localhost:3306/smart_restaurant_multitenant?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: Yexiajia0422.
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: false
      hibernate.show_sql: false
    database-platform: org.hibernate.dialect.MySQL8Dialect

  profiles:
    active: prod

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

  redis:
    host: 127.0.0.1
    port: 6379
    timeout: 2000ms
    jedis:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

# 在现有配置后添加
# JWT 配置
jwt:
  secret: ${JWT_SECRET:SmartRestaurantJWT2024SecretKeyForDevelopmentOnlyPleaseChangeInProduction}
  expiration: ${JWT_EXPIRATION:86400000}  # 24小时
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7天
  issuer: smart-restaurant-management
  header: Authorization
  prefix: "Bearer "

# 日志配置
logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG