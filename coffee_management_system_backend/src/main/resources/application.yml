server:
  port: 8080
  # 开启Gzip压缩
  compression:
    enabled: true
    mime-types: application/javascript,text/css,text/html,application/json,image/jpeg,image/png,image/gif
    min-response-size: 1024

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/coffee_management_database?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: Yexiajia0422.
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: false  # 生产环境关闭SQL日志
    database-platform: org.hibernate.dialect.MySQL8Dialect

  # 生产环境配置
  profiles:
    active: prod

  redis:
    host: 127.0.0.1
    port: 6379
    timeout: 2000ms
    jedis:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

# 日志配置
logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
