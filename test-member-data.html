<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会员数据测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .section { margin-bottom: 30px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #409EFF; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin: 5px; }
        .result { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 4px; padding: 15px; margin-top: 10px; white-space: pre-wrap; font-family: monospace; max-height: 400px; overflow-y: auto; }
        .error { background: #f8d7da; border-color: #f5c6cb; color: #721c24; }
        .success { background: #d4edda; border-color: #c3e6cb; color: #155724; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>会员数据和等级测试</h1>
        
        <div class="section">
            <h3>1. 获取会员等级数据</h3>
            <button onclick="getMemberLevels()">获取会员等级</button>
            <div id="levelsResult" class="result"></div>
        </div>
        
        <div class="section">
            <h3>2. 获取会员数据</h3>
            <button onclick="getMembers()">获取会员列表</button>
            <div id="membersResult" class="result"></div>
        </div>
        
        <div class="section">
            <h3>3. 测试特定会员</h3>
            <input type="text" id="testPhone" value="19817581800" placeholder="输入手机号">
            <button onclick="testSpecificMember()">测试会员</button>
            <div id="specificMemberResult" class="result"></div>
        </div>
        
        <div class="section">
            <h3>4. 会员等级匹配测试</h3>
            <button onclick="testLevelMatching()">测试等级匹配</button>
            <div id="matchingResult" class="result"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        
        function getAuthHeaders() {
            const token = localStorage.getItem('token');
            return token ? { 'Authorization': `Bearer ${token}` } : {};
        }
        
        async function getMemberLevels() {
            const resultDiv = document.getElementById('levelsResult');
            try {
                const response = await fetch(`${API_BASE}/member-levels`, {
                    headers: getAuthHeaders()
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                resultDiv.className = 'result success';
                
                let output = `获取到 ${data.length} 个会员等级:\n\n`;
                data.forEach((level, index) => {
                    output += `${index + 1}. ${level.levelName}\n`;
                    output += `   - ID: ${level.id}\n`;
                    output += `   - 折扣率: ${level.discountRate} (${(level.discountRate * 10).toFixed(1)}折)\n`;
                    output += `   - 积分倍率: ${level.pointRate}\n`;
                    output += `   - 启用状态: ${level.isEnabled}\n`;
                    output += `   - 排序: ${level.sortOrder}\n\n`;
                });
                
                resultDiv.textContent = output;
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `错误: ${error.message}`;
            }
        }
        
        async function getMembers() {
            const resultDiv = document.getElementById('membersResult');
            try {
                const response = await fetch(`${API_BASE}/members`, {
                    headers: getAuthHeaders()
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                resultDiv.className = 'result success';
                
                let output = `获取到 ${data.length} 个会员:\n\n`;
                data.forEach((member, index) => {
                    output += `${index + 1}. ${member.name}\n`;
                    output += `   - 手机号: ${member.phone}\n`;
                    output += `   - 等级: ${member.level}\n`;
                    output += `   - 余额: ¥${member.balance}\n`;
                    output += `   - 邮箱: ${member.email}\n\n`;
                });
                
                resultDiv.textContent = output;
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `错误: ${error.message}`;
            }
        }
        
        async function testSpecificMember() {
            const resultDiv = document.getElementById('specificMemberResult');
            const phone = document.getElementById('testPhone').value;
            
            try {
                // 获取会员信息
                const membersResponse = await fetch(`${API_BASE}/members`, {
                    headers: getAuthHeaders()
                });
                const members = await membersResponse.json();
                const member = members.find(m => m.phone === phone);
                
                if (!member) {
                    throw new Error('未找到指定手机号的会员');
                }
                
                // 获取会员等级信息
                const levelsResponse = await fetch(`${API_BASE}/member-levels`, {
                    headers: getAuthHeaders()
                });
                const levels = await levelsResponse.json();
                
                resultDiv.className = 'result success';
                
                let output = `会员信息:\n`;
                output += `姓名: ${member.name}\n`;
                output += `手机号: ${member.phone}\n`;
                output += `等级: ${member.level}\n`;
                output += `余额: ¥${member.balance}\n`;
                output += `邮箱: ${member.email}\n\n`;
                
                output += `等级匹配测试:\n`;
                const matchingLevel = levels.find(l => l.levelName === member.level && l.isEnabled);
                if (matchingLevel) {
                    output += `✓ 找到匹配的等级配置\n`;
                    output += `  - 等级名称: ${matchingLevel.levelName}\n`;
                    output += `  - 折扣率: ${matchingLevel.discountRate}\n`;
                    output += `  - 积分倍率: ${matchingLevel.pointRate}\n`;
                    output += `  - 启用状态: ${matchingLevel.isEnabled}\n`;
                } else {
                    output += `✗ 未找到匹配的等级配置\n`;
                    output += `可用等级: ${levels.filter(l => l.isEnabled).map(l => l.levelName).join(', ')}\n`;
                }
                
                resultDiv.textContent = output;
                
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `错误: ${error.message}`;
            }
        }
        
        async function testLevelMatching() {
            const resultDiv = document.getElementById('matchingResult');
            
            try {
                // 获取所有数据
                const [membersResponse, levelsResponse] = await Promise.all([
                    fetch(`${API_BASE}/members`, { headers: getAuthHeaders() }),
                    fetch(`${API_BASE}/member-levels`, { headers: getAuthHeaders() })
                ]);
                
                const members = await membersResponse.json();
                const levels = await levelsResponse.json();
                
                resultDiv.className = 'result';
                
                let output = `等级匹配分析:\n\n`;
                
                // 统计会员等级分布
                const levelCounts = {};
                members.forEach(member => {
                    const level = member.level || '未设置';
                    levelCounts[level] = (levelCounts[level] || 0) + 1;
                });
                
                output += `会员等级分布:\n`;
                Object.entries(levelCounts).forEach(([level, count]) => {
                    const hasConfig = levels.some(l => l.levelName === level && l.isEnabled);
                    const status = hasConfig ? '✓' : '✗';
                    output += `  ${status} ${level}: ${count}人\n`;
                });
                
                output += `\n可用等级配置:\n`;
                levels.filter(l => l.isEnabled).forEach(level => {
                    const memberCount = levelCounts[level.levelName] || 0;
                    output += `  - ${level.levelName}: ${(level.discountRate * 10).toFixed(1)}折, ${memberCount}人使用\n`;
                });
                
                output += `\n问题诊断:\n`;
                const orphanLevels = Object.keys(levelCounts).filter(level => 
                    level !== '未设置' && !levels.some(l => l.levelName === level && l.isEnabled)
                );
                
                if (orphanLevels.length > 0) {
                    output += `⚠️ 以下会员等级没有对应的配置: ${orphanLevels.join(', ')}\n`;
                } else {
                    output += `✓ 所有会员等级都有对应的配置\n`;
                }
                
                resultDiv.textContent = output;
                
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `错误: ${error.message}`;
            }
        }
    </script>
</body>
</html>
